<div class="shell-layout">
  <vc-navbar
    brandLabel="Vyra"
    brandAccent="Care"
    brandSubtitle="Gestao integrada para clinicas e profissionais de saude"
    [logoClickable]="true"
    [searchValue]="searchValue()"
    [notifications]="notifications"
    [profileName]="userDisplayName"
    [profileRole]="userAccessLevel"
    [profileInitials]="userInitials"
    [profileActions]="profileActions"
    (searchChange)="handleSearchChange($event)"
    (searchSubmitted)="handleSearchSubmit($event)"
    (logoClicked)="navigateToRoot()"
    (profileActionSelected)="handleProfileAction($event)"
  ></vc-navbar>

  @if (!mobileMenuOpen()) {
    <button
      type="button"
      class="mobile-menu-trigger"
      aria-controls="shell-navigation"
      aria-label="Abrir menu de navegacao"
      aria-expanded="false"
      (click)="toggleMobileMenu()"
    >
      <vc-icon name="list" size="md" [decorative]="true"></vc-icon>
    </button>
  }

  <button
    type="button"
    class="shell-navigation-backdrop"
    [class.is-open]="mobileMenuOpen()"
    aria-label="Fechar menu de navegacao"
    [attr.tabindex]="mobileMenuOpen() ? 0 : -1"
    (click)="closeMobileMenu()"
  ></button>

  <div class="shell-body">
    <div id="shell-navigation" class="shell-sidebar" [class.is-open]="mobileMenuOpen()">
      <div class="shell-sidebar-header">
        <strong>Navegacao</strong>
        <button type="button" aria-label="Fechar menu" (click)="closeMobileMenu()">
          <vc-icon name="x-lg" size="sm" [decorative]="true"></vc-icon>
        </button>
      </div>
      <vc-sidebar
        [groups]="sidebarGroups"
        [activeItemId]="activeSidebarItemId"
        [support]="sidebarSupport"
        (itemSelected)="selectSidebarItem($event)"
      ></vc-sidebar>
    </div>

    <main class="shell-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
